# Phase 9 (owner decision 2026-10-12): background execution for owner-approved
# Phase 9 tasks only. Sorts after phase6-preflight.conf, which keeps the general
# mission worker off; legacy missions stay queued for explicit runs.
[Service]
Environment=JARVIS_MISSION_WORKER=1
Environment=JARVIS_MISSION_WORKER_KINDS=agent_task
