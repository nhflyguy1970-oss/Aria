# Ollama drop-in: give the CUDA kernel cache a writable home.
#
# Ollama runs as user "ollama" whose home (/usr/share/ollama) is owned by root, so CUDA
# cannot create ~/.nv/ComputeCache. The cuda_v13 runner ships only PTX for the RTX 3060
# (sm_86), so every model load re-JIT-compiles its kernels: measured 2026-10-14 with the
# same llama-server binary, a load + first reply took 21.8 s + 23.0 s with an empty cache
# and 1.5 s + 0.3 s with it. That is most of ARIA's 70 s cold chat starts.
#
# Install (as root; restarts Ollama, so run it while ARIA is idle):
#   sudo install -m 644 scripts/systemd/ollama-cuda-cache.conf /etc/systemd/system/ollama.service.d/cuda-cache.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# Changes no GPU clock, power, fan or memory setting; it only sets where compiled kernels are kept.
[Service]
Environment="CUDA_CACHE_PATH=/usr/share/ollama/.ollama/cuda-cache"
Environment="CUDA_CACHE_MAXSIZE=4294967296"
